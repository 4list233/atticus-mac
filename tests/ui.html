<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Atticus UI regression checks</title>
<style>
  body { background: #141416; color: #f5f5f7; font: 14px system-ui; margin: 32px; }
  iframe { width: 460px; height: 540px; border: 0; border-radius: 18px; background: #262629; }
  pre { white-space: pre-wrap; line-height: 1.8; } .pass { color: #30d158; } .fail { color: #ff453a; }
</style>
<h1>Atticus UI regression checks</h1><p>Local fixture. No microphone, Claude, clipboard, or Mac actions.</p>
<pre id="results">Running…</pre><iframe id="preview" title="Atticus overlay preview"></iframe>
<script type="module">
const results = document.getElementById('results'), frame = document.getElementById('preview');
const messages = [], checks = [];
const assert = (condition, name) => { if (!condition) throw Error(name); checks.push('✓ ' + name); };
try {
  const html = await (await fetch('../ui/ui.html')).text(), orbs = await (await fetch('../ui/orbs.js')).text();
  const ready = new Promise(resolve => window.addEventListener('message', e => {
    if (e.source !== frame.contentWindow) return;
    messages.push(e.data); if (e.data.ready) resolve();
  }));
  const bridge = `<script>
    window.expireApproval = null;
    const later = window.setTimeout;
    window.setTimeout = (f, ms, ...args) => ms === 60000 ? (window.expireApproval = f, 0) : later(f, ms, ...args);
    window.webkit = {messageHandlers: {c: {postMessage: m => parent.postMessage(m, '*')}, h: {postMessage: () => {}}}};
  <\/script>`;
  frame.srcdoc = html.replace('/*ORBS*/', () => orbs).replace('<head>', '<head>' + bridge);
  await Promise.race([ready, new Promise((_, reject) => setTimeout(() => reject(Error('UI did not initialize')), 5000))]);
  const w = frame.contentWindow, d = w.document, ui = w.ui;
  const tap = el => { const r = el.getBoundingClientRect(); ui.tap([r.x + r.width / 2, r.y + r.height / 2]); };
  ui.listen();
  assert(!d.getElementById('comp').classList.contains('open'), 'Voice starts with the typing box hidden');
  ui.hover(true); assert(d.getElementById('comp').classList.contains('open'), 'Hover reveals the typing box');
  ui.hover(false); await new Promise(resolve => setTimeout(resolve, 280));
  assert(!d.getElementById('comp').classList.contains('open') && d.getElementById('comp').offsetHeight === 0, 'Leaving smoothly collapses an untouched composer');
  ui.hover(true); d.getElementById('ask').focus(); ui.hover(false);
  assert(d.getElementById('comp').classList.contains('open'), 'Focused typing stays open on mouse exit');
  d.getElementById('ask').value = 'Keep my draft'; d.getElementById('ask').blur();
  assert(d.getElementById('comp').classList.contains('open'), 'A typed draft survives mouse exit and blur');
  d.getElementById('ask').value = ''; ui.reset(); ui.listen();
  assert(d.querySelectorAll('.turn').length === 1 && ((d.getElementById('status').textContent + d.getElementById('thread').textContent).match(/Listening…/g) || []).length === 1, 'Listening is shown once');
  assert(w.getComputedStyle(d.querySelector('.q')).display !== 'none' && w.getComputedStyle(d.querySelector('.q'), '::before').content.includes('Listening'), 'Voice shows a Listening bubble before speech');
  ui.words('');
  assert(w.getComputedStyle(d.querySelector('.q')).display !== 'none', 'Empty speech updates keep the Listening bubble');
  ui.shortcut('Press again to send');
  assert(d.getElementById('status').textContent === 'Listening…', 'Listening says just Listening, no send hint');
  ui.line('· Preparing a response');
  assert(d.getElementById('status').textContent === 'Listening…', 'Early reasoning keeps Listening');
  ui.words('Open Notes');
  assert(w.getComputedStyle(d.querySelector('.q')).display !== 'none', 'Speech reveals the transcript bubble');
  assert(!d.querySelector('.elapsed'), 'Speaking does not count as response time');
  ui.think();
  const elapsed = d.querySelector('.elapsed b');
  await new Promise(resolve => setTimeout(resolve, 65));
  assert(/^\d+\.\d{2} s$/.test(elapsed.textContent) && parseFloat(elapsed.textContent) > 0, 'Elapsed response time counts in hundredths');
  ui.think(); assert(d.querySelectorAll('.elapsed').length === 1, 'Repeated thinking keeps one timer');
  assert(d.getElementById('status').textContent === 'Thinking…', 'Sending switches to Thinking');
  ui.line('✓ Notes is open.');
  const completedTime = elapsed.textContent;
  await new Promise(resolve => setTimeout(resolve, 65));
  assert(elapsed.textContent === completedTime, 'Completion freezes the elapsed time');
  ui.listen(true); ui.words('Open Safari'); ui.think(); ui.line('✓ Safari is open.');
  tap(d.querySelector('.a'));
  await new Promise(resolve => setTimeout(resolve, 30));
  assert(messages.some(m => m.copy === 'Notes is open.'), 'Copying an older answer copies that answer');
  tap(d.querySelector('.q'));
  assert(d.getElementById('ask').value === 'Open Notes', 'Click a transcript to edit it');
  d.getElementById('ask').value = '';
  d.getElementById('ask').dispatchEvent(new w.KeyboardEvent('keydown', {key: 'ArrowUp', bubbles: true}));
  assert(d.getElementById('ask').value === 'Open Safari', 'Up arrow recalls the latest request');
  ui.draft('Please check these partial words');
  assert(d.getElementById('ask').value === 'Please check these partial words' && d.activeElement === d.getElementById('ask'), 'Unconfirmed speech is editable and focused');
  ui.ask(['Send this?', 'echo preview']);
  assert(!!d.querySelector('.ok'), 'Approval card is visible');
  ui.stopped('Answer stopped');
  const stoppedTime = d.querySelector('.turn:last-child .elapsed b')?.textContent;
  await new Promise(resolve => setTimeout(resolve, 65));
  assert(d.querySelector('.turn:last-child .elapsed b')?.textContent === stoppedTime, 'Cancellation stops the timer');
  assert(!d.querySelector('.ok'), 'Cancelling removes approval controls');
  ui.ask(['Send this?', 'echo preview']); w.expireApproval();
  assert(!d.querySelector('.ok'), 'Expired approval cannot be clicked');
  ui.reset(); ui.listen(true); ui.words('Open my essay'); ui.think();
  ui.pick({q: 'Which essay?', options: [{label: 'essay.pdf', sub: '~/Documents · Oct 9, 2026', img: 'data:image/gif;base64,R0lGODlhAQABAAAAACw='}, {label: 'essay.docx', sub: '~/Desktop', img: '', kind: 'DOCX'}]});
  const choice = i => d.querySelectorAll('.pk .c')[i];
  const paused = d.querySelector('.turn:last-child .elapsed b').textContent; await new Promise(resolve => setTimeout(resolve, 65));
  assert(d.querySelector('.turn:last-child .elapsed b').textContent === paused, 'The timer pauses while the choices wait for you');
  assert(d.querySelectorAll('.pk .c').length === 2 && choice(1).textContent.startsWith('DOCX'), 'Choices card shows every option, a file type when there is no preview');
  tap(choice(1));
  assert(d.querySelector('.pk.open .c.on') === choice(1), 'Clicking a choice shows it big');
  tap(d.querySelector('.pk > b'));
  assert(!d.querySelector('.pk.open'), 'Clicking outside it shows all the choices again');
  tap(choice(0)); d.querySelector('.pk .go').scrollIntoView({block: 'nearest', behavior: 'instant'}); tap(d.querySelector('.pk .go')); await new Promise(resolve => setTimeout(resolve, 30));
  assert(messages.some(m => m.pick === '0') && d.querySelector('.step.done')?.textContent === 'Picked essay.pdf', 'Use this sends the one picked');
  await new Promise(resolve => setTimeout(resolve, 65));
  assert(d.querySelector('.turn:last-child .elapsed b').textContent !== paused, 'The timer runs again after you pick');
  ui.pick({q: 'Which song?', options: [{label: 'Yellow', sub: '', img: ''}, {label: 'Fix You', sub: '', img: ''}]});
  tap(choice(1)); await new Promise(resolve => setTimeout(resolve, 30));
  assert(messages.some(m => m.pick === '1'), 'Without previews one click picks');
  ui.pick({q: 'Which song?', options: [{label: 'Yellow', sub: '', img: ''}]}); ui.stopped('Answer stopped');
  assert(!d.querySelector('.pk'), 'Cancelling removes the choices');
  ui.reset(); ui.listen(true);
  ui.limit(280); ui.compose(true); await new Promise(resolve => setTimeout(resolve, 280)); ui.hold(1000);
  assert(d.getElementById('card').offsetHeight <= 280, 'Manual resize fits the available screen');
  assert(d.getElementById('comp').getBoundingClientRect().bottom <= 280, 'Composer remains reachable after resize');
  ui.reset();
  assert(d.getElementById('thread').style.maxHeight === '', 'New conversation clears stale resize constraints');
  ui.listen(true); ui.words('A'.repeat(400)); ui.think(); ui.line('✓ ' + 'https://example.com/' + 'a'.repeat(400));
  assert(d.getElementById('card').scrollWidth <= 460, 'Long URLs and transcripts do not overflow the card');
  ui.reset(); ui.listen(true); ui.words('Worker completion'); ui.think(); ui.finished();
  const finishedTime = d.querySelector('.elapsed b').textContent;
  await new Promise(resolve => setTimeout(resolve, 65));
  assert(d.querySelector('.elapsed b').textContent === finishedTime, 'Worker exit freezes time even without a final answer');
  ui.msg('Worker stopped');
  ui.reset(); ui.listen(true); ui.words('Put Notes on the left.'); ui.think();
  ui.line('▸ Moving Notes → left'); ui.line('✓ Notes is on the left.'); ui.compose(true);
  results.textContent = checks.join('\n') + `\n\n${checks.length} checks passed.`; results.className = 'pass';
} catch (error) { results.textContent = checks.join('\n') + '\n✗ ' + error.message; results.className = 'fail'; }
</script></html>
