<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root { color-scheme:dark; --fg:#f5f5f7; --fg2:#a1a1a6; --fg3:#6e6e73; --card:rgba(30,30,34,.92); --line:rgba(255,255,255,.08); --fill:rgba(255,255,255,.05); --fill2:rgba(255,255,255,.09);
  --accent:#0a84ff; --green:#30d158; --amber:#ff9f0a; --red:#ff453a; --spring:cubic-bezier(.16,1,.3,1); --ease:cubic-bezier(.2,.7,.3,1); }
* { box-sizing:border-box } html,body { margin:0; background:transparent }
body { color:var(--fg); font:13px -apple-system,BlinkMacSystemFont,sans-serif; -webkit-font-smoothing:antialiased; user-select:none; cursor:default }
body.view { background:rgba(15,15,18,.9) }
button,input { font:inherit; color:inherit } a { color:inherit; text-decoration:none; cursor:pointer }
button { display:inline-flex; align-items:center; justify-content:center; gap:5px; border:0; border-radius:8px; padding:0 11px; height:26px; background:var(--fill2); cursor:pointer; font-weight:500; font-size:12px; white-space:nowrap;
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.1); transition:background .2s, transform .3s var(--spring) } button:hover { background:rgba(255,255,255,.14) } button:active { transform:scale(.96) }
button.go { background:var(--accent); box-shadow:none } button.go:hover { background:#2b95ff } button.ghost { background:transparent; box-shadow:none; color:var(--fg2) } button.ghost:hover { background:var(--fill); color:var(--fg) }
button:disabled { opacity:.35; cursor:default; transform:none } :focus-visible { outline:2px solid var(--accent); outline-offset:2px }
svg.i { width:14px; height:14px; flex:none; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round }
.dot { width:7px; height:7px; border-radius:50%; flex:none; background:var(--fg3) }
.s-running .dot,.s-queued .dot { background:var(--accent); box-shadow:0 0 8px rgba(10,132,255,.7); animation:breathe 1.8s ease-in-out infinite }
.s-needs-you .dot,.s-waiting-screen .dot { background:var(--amber); box-shadow:0 0 8px rgba(255,159,10,.6); animation:breathe 2.4s ease-in-out infinite }
.s-done .dot { background:var(--green) } .s-failed .dot { background:var(--red) }
.live-text { background:linear-gradient(90deg,var(--fg) 0 40%,#fff8 50%,var(--fg) 60% 100%) 0/250% 100%; -webkit-background-clip:text; color:transparent; animation:sheen 2.4s linear infinite }
.enter { animation:enter .42s var(--spring) both }

/* sources: favicon chips (the site's own icon over a monogram) */
.sources { display:flex; flex-wrap:wrap; gap:5px } .source { display:inline-flex; align-items:center; gap:6px; max-width:180px; height:22px; padding:0 8px 0 4px; border-radius:11px; background:var(--fill);
  box-shadow:inset 0 0 0 .5px var(--line); font-size:11px; color:var(--fg2); transition:background .2s, color .2s } .source:hover { background:var(--fill2); color:var(--fg) }
.source span { overflow:hidden; white-space:nowrap; text-overflow:ellipsis } .fav { position:relative; width:14px; height:14px; border-radius:4px; flex:none; overflow:hidden; display:grid; place-items:center;
  background:rgba(255,255,255,.14); font-size:8.5px; font-weight:700; color:var(--fg) } .fav img { position:absolute; inset:0; width:100%; height:100%; background:#fff }
.more { font-size:11px; color:var(--fg3); align-self:center; padding:0 4px }

/* made things: one card per created doc, sheet, event, file or link */
.made { display:grid; grid-template-columns:minmax(0,1fr); gap:6px } .thing { display:flex; align-items:center; gap:11px; padding:9px 10px 9px 9px; border-radius:11px; background:var(--fill); box-shadow:inset 0 0 0 .5px var(--line); text-align:left;
  height:auto; width:100%; font-weight:400; transition:background .2s } .thing:hover { background:var(--fill2) } .thing:active { transform:scale(.99) }
.tile { width:34px; height:34px; border-radius:9px; flex:none; display:grid; place-items:center; background:rgba(255,255,255,.08); box-shadow:inset 0 0 0 .5px rgba(255,255,255,.12) } .tile svg.i { width:17px; height:17px }
.thing.main .tile { background:var(--accent); box-shadow:0 4px 14px rgba(10,132,255,.35) } .thing .t { min-width:0; flex:1 } .thing b { display:block; font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.thing small { display:block; margin-top:2px; font-size:11px; color:var(--fg3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis } .inside .thing .open { font-size:0 } .thing .open { font-size:11.5px; font-weight:500; color:var(--accent); flex:none; display:flex; align-items:center; gap:3px }

/* approval inside a chip or the view */
.pk { padding:12px; border-radius:12px; background:rgba(255,159,10,.08); box-shadow:inset 0 0 0 .5px rgba(255,159,10,.35) } .pk b { display:flex; gap:7px; align-items:center; font-size:12.5px; font-weight:600 } .pk b svg { color:var(--amber) }
.pk p { color:var(--fg2); font:11px/1.45 ui-monospace,Menlo,monospace; white-space:pre-wrap; overflow-wrap:anywhere; max-height:96px; overflow:auto; user-select:text; margin:8px 0 0 } .pk .actions { margin-top:11px; flex-wrap:wrap } .inside .pk .actions { display:grid; grid-template-columns:1fr 1fr } .inside .pk .task { grid-column:1/-1; order:1 }
.actions { display:flex; gap:6px; align-items:center }
.pk .why { margin-top:7px; font-size:12px; line-height:1.4; color:var(--fg) } .pk .note { margin-top:4px; font-size:11px; line-height:1.4; color:var(--fg2) }
.pk .note.waiting::before { content:''; display:inline-block; width:6px; height:6px; margin:0 6px 1px 0; border-radius:50%; background:var(--amber); animation:breathe 2.4s ease-in-out infinite }
.inside .pk .actions > :only-child { grid-column:1/-1 } .pk button.go { padding-right:5px }
kbd { min-width:20px; height:18px; padding:0 5px; border-radius:5px; display:inline-grid; place-items:center; font:500 10.5px system-ui; color:#c7c7cc; background:rgba(255,255,255,.1); box-shadow:inset 0 0 0 .5px rgba(255,255,255,.16), 0 1px 0 rgba(0,0,0,.3) }
.go kbd { color:#fff; background:rgba(255,255,255,.22); box-shadow:inset 0 0 0 .5px rgba(255,255,255,.3) } .time { margin-left:auto; color:var(--fg3); font-size:10.5px; font-variant-numeric:tabular-nums }
.mini { height:132px; border-radius:10px; background:#0004; box-shadow:inset 0 0 0 .5px var(--line); display:flex; justify-content:center; align-items:center; color:var(--fg3); font-size:11px; cursor:pointer }

/* ── shelf ── */
/* Motion is transforms, opacity and clip only (Web Animations); layout changes once per state, never per frame. */
#shelf { padding:4px; display:flex; flex-direction:column; gap:6px }
.chip { position:relative; flex:none; border-radius:14px; background:var(--card); overflow:hidden; box-shadow:inset 0 0 0 .5px rgba(255,255,255,.11), 0 6px 18px rgba(0,0,0,.28) }
.chip.waiting { opacity:0 } .chip.steered { box-shadow:inset 0 0 0 1px rgba(10,132,255,.7), 0 0 0 3px rgba(10,132,255,.18), 0 6px 18px rgba(0,0,0,.28); transition:box-shadow .4s var(--ease) } .chip.steered .head .step { color:#64b5ff }
.ctl { position:absolute; top:11px; right:7px; display:flex; gap:3px; padding-left:16px; opacity:0; pointer-events:none; transition:opacity .15s;
  background:linear-gradient(90deg,transparent,rgb(30,30,34) 14px) } .chip.hover .ctl,.chip:focus-within .ctl { opacity:1; pointer-events:auto } .chip.hover .badge { opacity:0 }
.ctl button { width:22px; height:22px; padding:0; border-radius:11px; background:rgba(255,255,255,.09); box-shadow:none; color:var(--fg2) } .ctl button:hover { background:rgba(255,255,255,.18); color:var(--fg) } .ctl svg.i { width:10px; height:10px; stroke-width:2 }
.thumb { width:40px; height:28px; flex:none; border-radius:7px; background:#000; box-shadow:inset 0 0 0 .5px rgba(255,255,255,.18); display:grid; place-items:center; font-size:10px; font-weight:600; color:var(--fg3); pointer-events:none }
.pill { align-self:flex-end; flex:none; display:flex; align-items:center; gap:8px; height:36px; padding:0 13px 0 7px; border-radius:18px; background:var(--card); font-size:12px; font-weight:600;
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.11), 0 6px 18px rgba(0,0,0,.28) } .pill:hover { background:rgb(40,40,45) } .pill:active { transform:scale(.96) }
.pill .orbs { display:flex } .pill canvas { width:22px; height:22px; margin-left:-9px; pointer-events:none } .pill canvas:first-child { margin-left:0 } .pill .dot { width:6px; height:6px }
.head { width:100%; height:44px; display:flex; gap:8px; align-items:center; padding:0 11px 0 6px; background:transparent; box-shadow:none; border-radius:0; text-align:left; font-weight:400 }
.head:hover { background:transparent } .head:active { transform:none } .head canvas { width:28px; height:28px; flex:none; pointer-events:none }
.copy { min-width:0; flex:1; display:grid; gap:1px } .title { font-size:12px; font-weight:600; letter-spacing:-.1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.step { font-size:11px; color:var(--fg2); overflow:hidden; white-space:nowrap; text-overflow:ellipsis } .s-needs-you .head .step { color:var(--amber) } .s-failed .head .step { color:#ff8a80 }
.badge { flex:none; display:grid; place-items:center; width:18px; height:18px } .s-done .badge { border-radius:50%; background:rgba(48,209,88,.16); color:var(--green) } .badge svg.i { width:11px; height:11px; stroke-width:2.2 }
.chip progress { position:absolute; left:14px; right:14px; bottom:0; width:auto; display:block; height:2px; border:0; margin:0; -webkit-appearance:none; appearance:none; background:transparent }
.chip progress::-webkit-progress-bar { background:transparent } .chip progress::-webkit-progress-value { background:var(--accent); border-radius:1px; transition:width .5s var(--spring) }
.detail { display:none } .expanded .detail { display:block }
.inside { padding:2px 12px 12px; display:grid; grid-template-columns:minmax(0,1fr); gap:10px }
.current { font-size:13px; font-weight:500; line-height:1.4; overflow-wrap:anywhere } .steps { list-style:none; padding:0; margin:0; display:grid; gap:5px }
.steps li { display:flex; gap:8px; align-items:center; font-size:11px; color:var(--fg3); min-width:0 } .steps li span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis } .steps li:last-child { color:var(--fg2) } .steps li svg.i { width:12px; height:12px }

/* ── Agent view ── */
#full { height:100vh; display:none; grid-template-columns:216px minmax(0,1fr) } body.view #full { display:grid } body.view #shelf { display:none }
aside { display:flex; flex-direction:column; min-height:0; border-right:.5px solid var(--line); background:rgba(0,0,0,.12) }
.side-head { display:flex; align-items:center; justify-content:space-between; padding:8px 12px 10px 16px } .side-head b { font-size:13px; font-weight:600; letter-spacing:-.1px }
::-webkit-scrollbar { width:10px; height:10px } ::-webkit-scrollbar-thumb { background:rgba(255,255,255,.14); border-radius:5px; border:3px solid transparent; background-clip:padding-box } ::-webkit-scrollbar-track { background:transparent }
#list { overflow:auto; padding:0 8px 12px; flex:1 } .group { font-size:10.5px; font-weight:600; color:var(--fg3); letter-spacing:.2px; padding:12px 8px 5px }
.item { width:100%; height:auto; display:flex; gap:9px; align-items:flex-start; text-align:left; padding:8px; margin:1px 0; border-radius:8px; background:transparent; box-shadow:none; font-weight:400 }
.item:hover { background:var(--fill) } .item.selected { background:rgba(255,255,255,.1) } .item .dot { margin-top:5px } .item span { min-width:0; flex:1 }
.agent-row { position:relative; min-width:0 } .agent-row .item { padding-right:27px } .remove { position:absolute; right:4px; top:10px; width:22px; height:24px; padding:0; opacity:0; background:none; color:var(--fg3) } .agent-row:hover .remove,.agent-row:focus-within .remove { opacity:1 } .side-head .actions { gap:2px } .side-head .ghost { font-size:10px; padding:4px }
.side-head { flex-wrap:wrap; row-gap:5px } .side-head>.actions { width:100%; justify-content:flex-end }
.item b,.item small { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis } .item b { font-size:12.5px; font-weight:500 } .item small { color:var(--fg3); margin-top:2px; font-size:11px; font-variant-numeric:tabular-nums }
main { display:flex; min-width:0; flex-direction:column; height:100%; min-height:0 }
#scroll { flex:1; overflow:auto; overflow-x:hidden; min-height:0; user-select:text } #page { max-width:680px; margin:0 auto; padding:6px 28px 28px; display:grid; grid-template-columns:minmax(0,1fr); gap:18px } #body { display:grid; grid-template-columns:minmax(0,1fr); gap:20px }
header { display:flex; gap:13px; align-items:center; padding-top:4px } header canvas { width:38px; height:38px; flex:none } header .t { min-width:0; flex:1 }
header h1 { font-size:20px; font-weight:650; letter-spacing:-.45px; line-height:1.22; margin:0; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow-wrap:anywhere }
.status { display:flex; gap:7px; align-items:center; margin-top:4px; font-size:11.5px; color:var(--fg2); font-variant-numeric:tabular-nums } .status .dot { width:6px; height:6px } .status .time-label { margin-left:-3px }
#brief { color:var(--fg2); font-size:12.5px; line-height:1.55; margin:-6px 0 0 }
.label { font-size:10.5px; font-weight:600; letter-spacing:.3px; color:var(--fg3); margin-bottom:8px; display:flex; align-items:center; gap:8px }
.now { padding:16px 16px 14px; border-radius:14px; background:linear-gradient(180deg,rgba(10,132,255,.09),rgba(10,132,255,.03)); box-shadow:inset 0 0 0 .5px rgba(10,132,255,.28) }
.now .current { font-size:16px; font-weight:500; letter-spacing:-.2px; line-height:1.4 } .now .sources { margin-top:11px } .now .plan { margin-top:12px; display:flex; gap:4px } .now .plan i { height:3px; flex:1; border-radius:2px; background:rgba(255,255,255,.12) } .now .plan i.on { background:var(--accent) }
.s-needs-you .now,.s-waiting-screen .now { background:var(--fill); box-shadow:inset 0 0 0 .5px var(--line) }
.fail { padding:14px 16px; border-radius:14px; background:rgba(255,69,58,.08); box-shadow:inset 0 0 0 .5px rgba(255,69,58,.3); display:flex; gap:12px; align-items:center } .fail p { margin:0; flex:1; font-size:12.5px; line-height:1.5; color:#ffb4ad }
.result { padding:18px 20px; border-radius:14px; background:rgba(255,255,255,.035); box-shadow:inset 0 0 0 .5px var(--line); font-size:13.5px; line-height:1.62; overflow-wrap:anywhere }
.result>:first-child { margin-top:0 } .result>:last-child { margin-bottom:0 } .result p { margin:0 0 10px } .result h3,.result h4 { margin:16px 0 6px; font-size:14px; font-weight:650; letter-spacing:-.15px } .result h4 { font-size:13px; color:var(--fg2) }
.result ul,.result ol { margin:0 0 10px; padding-left:20px } .result li { margin:3px 0 } .result li::marker { color:var(--fg3) } .result strong { font-weight:650 } .result code { font:12px ui-monospace,Menlo,monospace; background:var(--fill2); padding:1px 5px; border-radius:5px }
.result a { color:var(--accent) } .result a:hover { text-decoration:underline } .result hr { border:0; border-top:.5px solid var(--line); margin:14px 0 }
.table { overflow-x:auto; margin:4px -4px 12px; } table { border-collapse:collapse; width:100%; font-size:12.5px; line-height:1.45 } th { text-align:left; font-weight:600; font-size:11px; color:var(--fg2); letter-spacing:.1px; padding:0 10px 7px; border-bottom:.5px solid rgba(255,255,255,.16); white-space:nowrap }
td { padding:8px 10px; border-bottom:.5px solid var(--line); vertical-align:top } tr:last-child td { border-bottom:0 } tbody tr:hover td { background:rgba(255,255,255,.025) } .num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap }
.writing .label { color:var(--accent) } .writing .result>:last-child::after { content:''; display:inline-block; width:6px; height:13px; margin-left:3px; vertical-align:-2px; border-radius:1px; background:var(--accent); animation:breathe 1s ease-in-out infinite }
.result .changes { color:var(--fg2); font-size:12.5px } .cost { font-size:11px; color:var(--fg3); margin-top:12px; font-variant-numeric:tabular-nums }
.fold { display:flex; justify-content:flex-start; align-items:center; gap:7px; width:100%; height:auto; padding:0; background:none; box-shadow:none; color:var(--fg3); font-size:10.5px; font-weight:600; letter-spacing:.3px } .fold:hover { background:none; color:var(--fg2) } .fold:active { transform:none }
.fold svg.i { width:10px; height:10px; stroke-width:2; transition:transform .3s var(--spring) } .open-fold>.fold svg.i { transform:rotate(90deg) } .fold small { font-weight:400; letter-spacing:0; color:var(--fg3) }
#timeline { display:grid; grid-template-rows:0fr; transition:grid-template-rows .42s var(--spring) } .open-fold #timeline { grid-template-rows:1fr } #timeline>div { overflow:hidden; min-height:0 }
.track { position:relative; padding:10px 0 2px } .track::before { content:''; position:absolute; left:11px; top:14px; bottom:14px; width:1px; background:linear-gradient(var(--line),var(--line) 80%,transparent) }
.entry { position:relative; display:grid; grid-template-columns:23px minmax(0,1fr); column-gap:9px; padding:5px 0 }
.entry .ico { width:23px; height:23px; border-radius:50%; display:grid; place-items:center; background:#232327; box-shadow:inset 0 0 0 .5px rgba(255,255,255,.12); color:var(--fg2); z-index:1 } .entry .ico svg.i { width:12px; height:12px }
.entry.note .ico { background:transparent; box-shadow:none } .entry.note .ico i { width:5px; height:5px; border-radius:50%; background:var(--fg3) } .entry.made .ico { color:var(--green) } .entry.last.live .ico { color:var(--accent); box-shadow:inset 0 0 0 .5px rgba(10,132,255,.6), 0 0 10px rgba(10,132,255,.35) }
.entry .line { display:flex; align-items:center; gap:7px; min-height:23px; font-size:12.5px; color:var(--fg2); min-width:0 } .entry .line span { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.entry.user .ico { visibility:hidden } .entry.user .line span { margin-left:auto; max-width:85%; white-space:normal; line-height:1.4; color:var(--fg); background:rgba(10,132,255,.2); padding:5px 10px; border-radius:12px 12px 4px 12px; animation:enter .35s var(--spring) }
.entry.note .line span { white-space:normal; color:var(--fg); line-height:1.45 } .entry .count { flex:none; font-size:10px; color:var(--fg3); background:var(--fill); border-radius:8px; padding:1px 6px; font-variant-numeric:tabular-nums }
.entry .line button { height:20px; padding:0 4px; background:none; box-shadow:none; color:var(--fg3); flex:none } .entry .line button:hover { color:var(--fg) } .entry .line button svg.i { width:10px; height:10px; stroke-width:2; transition:transform .3s var(--spring) } .entry.opened .line button svg.i { transform:rotate(90deg) }
.entry .body { grid-column:2; display:grid; gap:7px; margin-top:4px } .entry .body:empty { display:none } .entry .more-steps { display:none; font-size:11.5px; color:var(--fg3); line-height:1.7 } .entry.opened .more-steps { display:block } .more-steps code { font:10.5px ui-monospace,Menlo,monospace; color:var(--fg3) }
footer { padding:12px 20px 16px; border-top:.5px solid var(--line) } .ask { display:flex; align-items:center; gap:6px; max-width:680px; margin:0 auto; padding:4px 4px 4px 14px; border-radius:20px; background:var(--fill); box-shadow:inset 0 0 0 .5px rgba(255,255,255,.12); transition:box-shadow .2s, background .2s }
.ask:focus-within { background:rgba(255,255,255,.07); box-shadow:inset 0 0 0 .5px rgba(10,132,255,.6), 0 0 0 3px rgba(10,132,255,.16) } .ask input { flex:1; min-width:0; border:0; background:none; height:30px; outline:none; font-size:13px } .ask input::placeholder { color:var(--fg3) }
#send { width:30px; height:30px; padding:0; border-radius:50%; display:grid; place-items:center } #send svg.i { width:14px; height:14px; stroke-width:2 }
.empty { padding:80px 24px; text-align:center; color:var(--fg3); display:grid; gap:6px; justify-items:center } .empty b { color:var(--fg2); font-size:14px; font-weight:600 }
@media (max-width:640px) { #full { grid-template-columns:172px minmax(0,1fr) } #page { padding:6px 18px 22px } }
@keyframes breathe { 50% { opacity:.4 } } @keyframes sheen { to { background-position:-150% 0 } } @keyframes enter { from { opacity:0; transform:translateY(6px) } }
@media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; transition:opacity .16s!important } .live-text { color:var(--fg); background:none } }
</style>
<div id="shelf"></div>
<div id="full"><aside><div class="side-head"><b>Agents</b><div class="actions"><button id="clear-failed" class="ghost">Clear failed</button><button id="clear" class="ghost">Clear done</button></div></div><div id="list"></div></aside>
<main><div id="scroll"><div id="page"><header><canvas data-size="38"></canvas><div class="t"><h1 id="title">Agents</h1><div class="status" id="status"></div></div><div class="actions" id="tools"></div></header>
<p id="brief">Your tasks, while you do something else.</p><div id="body"></div></div></div>
<footer><div class="ask"><input id="followup" aria-label="Follow up with this agent" placeholder="Ask a follow-up…"><button id="send" class="go" aria-label="Send"></button></div></footer></main></div>
<script id="orbsrc" type="text/plain">/*ORBS*/</script>
<script type="module">
const E=await import(URL.createObjectURL(new Blob([document.getElementById('orbsrc').textContent],{type:'text/javascript'})));
const $=id=>document.getElementById(id), reduced=matchMedia('(prefers-reduced-motion: reduce)');
const post=data=>window.webkit?.messageHandlers.agents.postMessage(data);
