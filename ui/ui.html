<!doctype html>
<html><head><meta charset="utf-8">
<!-- Atticus overlay. Atticus.app loads this, puts orbs.js in place of the marker below, and calls window.ui.* -->
<style>
  :root { color-scheme: dark; --ease: cubic-bezier(.2,.8,.2,1); --spring: cubic-bezier(.34,1.56,.64,1); }
  html, body { margin: 0; background: transparent; overflow: hidden; -webkit-user-select: none; cursor: default;
    font: 13px -apple-system, system-ui, sans-serif; color: #f5f5f7; -webkit-font-smoothing: antialiased; }
  html { background: rgba(18,18,20,.5); }   /* a dark tint under the glass: the orb shows over white pages too */
  #card { padding: 12px 14px 14px; animation: pop .42s var(--spring) both; box-sizing: border-box;
    display: flex; flex-direction: column; max-height: var(--screen-height, 10000px); }
  #card.again { animation: none; }
  #card.held { box-sizing: border-box; display: flex; flex-direction: column; }   /* dragged to a height: keep it */
  #card.held #comp { margin-top: auto; } #card.held #thread { margin-bottom: 12px; }

  #head { display: flex; align-items: center; gap: 10px; height: 44px; flex: none; padding-right: 30px; }
  canvas { width: 44px; height: 44px; flex: none; margin-left: -4px; transition: transform .35s var(--ease); }
  #status { flex: 1; min-width: 0; font-size: 12.5px; color: #a1a1a6; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; }
  #status span { display: inline-block; max-width: 100%; vertical-align: top; overflow: hidden; text-overflow: ellipsis; animation: in .35s var(--ease) both; }
  #status.live span { background: linear-gradient(90deg, #8e8e93 0%, #fff 45%, #8e8e93 90%); background-size: 200% 100%;
    -webkit-background-clip: text; color: transparent; animation: in .35s var(--ease) both, shimmer 1.5s linear infinite; }

  #thread { max-height: 360px; min-height: 0; overflow-y: auto; scroll-behavior: smooth; padding-top: 2px;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 14px, #000 100%); }
  #thread::-webkit-scrollbar { width: 0; }
  #thread:empty { display: none; }
  .turn { padding-top: 10px; animation: in .4s var(--ease) both; transition: opacity .4s var(--ease); }
  .turn + .turn { margin-top: 10px; border-top: .5px solid rgba(255,255,255,.08); }
  .turn.old { opacity: .55; }

  .q { margin-left: auto; width: fit-content; max-width: 86%; padding: 7px 11px; border-radius: 14px 14px 4px 14px;
    background: rgba(255,255,255,.09); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.12);
    font-size: 13px; line-height: 1.38; color: #e5e5ea; overflow-wrap: anywhere; cursor: pointer;
    transition: font-size .3s var(--ease), color .3s; }
  .q.live { font-size: 15px; color: #fff; }
  .q.live::after { content: ""; display: inline-block; width: 1.5px; height: 1em; margin-left: 2px; vertical-align: -2px;
    background: #fff; animation: blink 1s steps(1) infinite; }
  .q.empty { display: none; }

  .steps { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
  .steps:empty { display: none; }
  .step { font-size: 12px; color: #8e8e93; display: flex; gap: 7px; align-items: center; white-space: nowrap;
    overflow: hidden; animation: in .35s var(--ease) both; }
  .step::before { content: ""; flex: none; width: 5px; height: 5px; border-radius: 50%; background: #636366;
    transition: background .3s; }
  .step span { overflow: hidden; text-overflow: ellipsis; }
  .step.live { color: #f5f5f7; }
  .step.live::before { background: #fff; animation: pulse 1s ease-in-out infinite; }
  .step.done::before { background: #30d158; }

  .a { margin-top: 9px; font-size: 14px; line-height: 1.48; overflow-wrap: anywhere; cursor: copy; }
  .a:empty { display: none; }
  .a .w { display: inline-block; animation: word .5s var(--ease) both; }
  .a.cancel { color: #8e8e93; font-size: 12.5px; }
  .a.stopped { display: flex; align-items: center; gap: 8px; color: #a1a1a6; font-size: 12.5px; letter-spacing: .1px; }
  .a.stopped i { width: 7px; height: 7px; border-radius: 2px; background: #ff453a; box-shadow: 0 0 8px rgba(255,69,58,.6);
    animation: in .35s var(--spring) both; }
  .step.cut { color: #636366; text-decoration: line-through; text-decoration-color: rgba(255,255,255,.2); }

  #x { position: absolute; top: 12px; right: 12px; width: 22px; height: 22px; border-radius: 50%; display: grid;
    place-items: center; opacity: .7; z-index: 2;
    background: radial-gradient(120% 120% at 30% 15%, rgba(255,255,255,.30), rgba(255,255,255,.07) 55%, rgba(255,255,255,.03));
    box-shadow: inset 0 0 0 .5px rgba(255,255,255,.35), inset 0 -1.5px 2px rgba(0,0,0,.28), 0 2px 6px rgba(0,0,0,.22);
    transition: transform .45s var(--spring), opacity .25s, box-shadow .3s, background .3s; }
  #x svg { width: 8px; height: 8px; stroke: #fff; stroke-width: 1.6; stroke-linecap: round; transition: transform .45s var(--spring); }
  #x.hot { transform: scale(1.28); opacity: 1;
    background: radial-gradient(120% 120% at 30% 15%, rgba(255,255,255,.5), rgba(255,255,255,.14) 55%, rgba(255,255,255,.06));
    box-shadow: inset 0 0 0 .5px rgba(255,255,255,.55), inset 0 -1.5px 3px rgba(0,0,0,.3), 0 0 0 4px rgba(255,255,255,.05),
      0 4px 14px rgba(0,0,0,.35); }
  #x.hot svg { transform: rotate(90deg); }

  /* safe mode: Atticus asks before it deletes, sends or buys */
  .ok { margin-top: 10px; padding: 11px 12px 12px; border-radius: 14px; background: rgba(255,255,255,.07); cursor: pointer;
    box-shadow: inset 0 0 0 .5px rgba(255,255,255,.14); animation: grow .32s var(--spring) both; overflow: hidden; max-height: 320px;
    transition: max-height .34s var(--ease), opacity .25s, margin .34s var(--ease), padding .34s var(--ease), background .2s; }
  .ok:hover { background: rgba(255,255,255,.09); }
  .ok.gone { max-height: 0; opacity: 0; margin-top: 0; padding-top: 0; padding-bottom: 0; }
  .ok b { display: block; font-size: 13.5px; font-weight: 600; }
  .ok code { display: block; margin-top: 4px; font: 11px/15px ui-monospace, Menlo, monospace; color: #8e8e93; max-height: 15px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: max-height .34s var(--ease), color .2s; }
  .ok:hover code { color: #aeaeb2; }
  .ok code.wrap { white-space: pre-wrap; overflow-wrap: anywhere; }
  .ok code.full { max-height: 165px; overflow-y: auto; color: #d1d1d6; }
  .ok code::-webkit-scrollbar { width: 0; }
  .ok div { display: flex; gap: 8px; margin-top: 11px; }
  .ok button { flex: 1; height: 28px; border: 0; border-radius: 14px; font: 500 12.5px -apple-system, system-ui, sans-serif; color: #fff;
    cursor: pointer; background: rgba(255,255,255,.1); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.16); transition: transform .3s var(--spring), background .2s; }
  .ok button.go { background: #0a84ff; box-shadow: none; }
  .ok button:hover { transform: scale(1.03); } .ok button:active { transform: scale(.96); }

  /* safe mode off: a small tag says so; clicking it turns safe mode back on */
  #mode { position: absolute; top: 12px; right: 42px; z-index: 2; display: none; align-items: center; gap: 5px; height: 22px; padding: 0 9px;
    box-sizing: border-box; border-radius: 11px; font-size: 11px; font-weight: 500; line-height: 1; color: #ff9f0a; cursor: pointer;
    background: rgba(255,159,10,.13); box-shadow: inset 0 0 0 .5px rgba(255,159,10,.32); transition: transform .3s var(--spring), background .2s; }
  #mode::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: #ff9f0a; }
  body:has(#mode.on) #head { padding-right: 130px; }
  #mode.on { display: flex; animation: in .35s var(--ease) both; } #mode:hover { transform: scale(1.05); background: rgba(255,159,10,.2); }

  /* tip: once in a while, one quiet line under the answer (Settings → Tips) */
  .tip { display: flex; align-items: baseline; gap: 7px; width: fit-content; max-width: 100%; margin-top: 10px; padding: 6px 12px 6px 10px; box-sizing: border-box;
    border-radius: 12px; font-size: 12px; line-height: 1.4; color: #e5e5ea; background: rgba(10,132,255,.16); box-shadow: inset 0 0 0 .5px rgba(10,132,255,.45);
    animation: pop .5s var(--spring) .4s both; }
  .tip::before { content: attr(data-k); flex: none; font-weight: 600; color: #64d2ff; }
  .tip.learned { background: rgba(48,209,88,.14); box-shadow: inset 0 0 0 .5px rgba(48,209,88,.45); } .tip.learned::before { color: #30d158; }
  .tip.gone { opacity: 0; transform: translateY(-4px); transition: opacity .4s, transform .4s; }

  /* typing box: grows in on hover (or the shortcut, in typing mode); the mic goes back to voice */
  #comp { display: flex; align-items: center; gap: 8px; margin-top: 0; height: 0; opacity: 0; overflow: hidden; flex: none; transition: height .24s var(--ease), margin-top .24s var(--ease), opacity .18s; }
  #comp.open { height: 36px; margin-top: 12px; opacity: 1; }
  #ask { flex: 1; min-width: 0; height: 34px; box-sizing: border-box; padding: 0 13px; border: 0; outline: 0; border-radius: 17px;
    font: 13.5px -apple-system, system-ui, sans-serif; color: #fff; caret-color: #0a84ff; -webkit-user-select: text; cursor: text;
    background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.14); transition: background .25s, box-shadow .25s; }
  #ask::placeholder { color: #8e8e93; }
  #ask:focus { background: rgba(255,255,255,.12); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.22), 0 0 0 3px rgba(10,132,255,.35); }
  #mic { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 0; padding: 0; display: grid; place-items: center; cursor: pointer;
    background: radial-gradient(120% 120% at 30% 15%, rgba(255,255,255,.26), rgba(255,255,255,.07) 60%);
    box-shadow: inset 0 0 0 .5px rgba(255,255,255,.3), 0 2px 6px rgba(0,0,0,.22); transition: transform .35s var(--spring), background .25s; }
  #mic:hover { transform: scale(1.1); background: radial-gradient(120% 120% at 30% 15%, rgba(255,255,255,.4), rgba(255,255,255,.12) 60%); }
  #mic:active { transform: scale(.94); }
  #mic svg { width: 15px; height: 15px; fill: none; stroke: #fff; stroke-width: 1.8; stroke-linecap: round; }

  /* resize: drag the bottom-right corner */
  #grip { position: absolute; right: 4px; bottom: 4px; width: 12px; height: 12px; opacity: 0; transition: opacity .25s; cursor: nwse-resize; }
  .e { position: fixed; z-index: 3; }
  #eL, #eR { top: 0; bottom: 0; width: 6px; cursor: ew-resize; } #eL { left: 0; } #eR { right: 0; }
  #eT, #eB { left: 0; right: 0; height: 6px; cursor: ns-resize; } #eT { top: 0; } #eB { bottom: 0; }
  #cTL, #cTR, #cBL, #cBR { width: 14px; height: 14px; z-index: 4; }
  #cTL { top: 0; left: 0; cursor: nwse-resize; } #cBR { bottom: 0; right: 0; cursor: nwse-resize; }
  #cTR { top: 0; right: 0; cursor: nesw-resize; } #cBL { bottom: 0; left: 0; cursor: nesw-resize; }
  body:hover #grip { opacity: .45; }
  #grip svg { width: 12px; height: 12px; stroke: #fff; stroke-width: 1.2; stroke-linecap: round; }

  @keyframes grow { from { opacity: 0; transform: translateY(-6px) scale(.97); } }
  @keyframes pop { from { opacity: 0; transform: scale(.94) translateY(-6px); } to { opacity: 1; transform: none; } }
  @keyframes in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  @keyframes word { from { opacity: 0; filter: blur(5px); transform: translateY(3px); } to { opacity: 1; filter: none; transform: none; } }
  @keyframes pulse { 50% { opacity: .3; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
  button:focus-visible { outline: 2px solid #64d2ff; outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
    #status.live span { background: none; color: #f5f5f7; }
  }
</style></head>
<body>
<div id="mode" title="Safe mode is off. Click to turn it on.">Full access</div>
<div id="x"><svg viewBox="0 0 10 10"><path d="M1 1L9 9M9 1L1 9"/></svg></div>
<div id="card">
  <div id="head"><canvas id="orb"></canvas><div id="status"></div></div>
  <div id="thread"></div>
  <div id="comp" inert><input id="ask" placeholder="Ask Atticus…" autocomplete="off" spellcheck="false" aria-label="Ask Atticus">
    <button id="mic" title="Talk instead" aria-label="Talk instead"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></button></div>
</div>
<div class="e" id="eL"></div><div class="e" id="eR"></div><div class="e" id="eT"></div><div class="e" id="eB"></div>
<div class="e" id="cTL"></div><div class="e" id="cTR"></div><div class="e" id="cBL"></div><div class="e" id="cBR"></div>
<div id="grip"><svg viewBox="0 0 12 12"><path d="M11 4L4 11M11 8L8 11"/></svg></div>
<script type="text/plain" id="orbsrc">/*ORBS*/</script>
<script type="module">
  // thinking-orbs engine: M = MODE_FRAMES, p = paintFrame, r = resolvePreset (its minified export names)
  const E = await import(URL.createObjectURL(new Blob([document.getElementById('orbsrc').textContent], { type: 'text/javascript' })));
  const $ = id => document.getElementById(id);
  const cv = $('orb'), ctx = cv.getContext('2d'), S = 64, dpr = 2;
  cv.width = cv.height = S * dpr;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  let visible = true;
  let preset = E.r('breathing', S), state = 'breathing', boost = 1, t = 0, prev = performance.now();
  const setState = s => { if (s !== state) { state = s; preset = E.r(s, S); } };
  (function frame(now) {
    if (visible) {
      t += Math.min(0.05, (now - prev) / 1000) * preset.speed * boost * (reduced.matches ? 0 : 1);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, S, S);
      E.p(ctx, E.M[preset.mode](S, t, preset.opts), true, null);
    }
    prev = now;
    setTimeout(() => requestAnimationFrame(frame), visible && !reduced.matches ? 0 : 250);
  })(prev);

  const turn = () => $('thread').lastElementChild;
  const part = c => turn()?.querySelector('.' + c);
  const post = m => webkit.messageHandlers.c.postMessage(m);
  const fit = (follow = true) => {
    webkit.messageHandlers.h.postMessage($('card').offsetHeight);
    if (follow) $('thread').scrollTop = $('thread').scrollHeight;
    post({ comp: $('comp').classList.contains('open') ? $('card').offsetHeight - $('comp').offsetTop + 4 : 0 });   // where clicks type, not drag
  };
  // Typing box. listening: the mic is on (clicking in drops it). Enter always sends; the app ignores it while an answer runs,
  // and the text stays in the box until the app takes it (ui.listen), so nothing typed is lost.
  let listening = false, hover = false, working = false, listeningHint = '';
  let compFrame = 0;
  const comp = (on, focus) => {
    $('comp').inert = !on;
    if ($('comp').classList.contains('open') !== on) {
      $('comp').classList.toggle('open', on); fit();
      cancelAnimationFrame(compFrame);
      const end = performance.now() + 250;
      const resize = () => { fit(false); if (performance.now() < end) compFrame = requestAnimationFrame(resize); };
      compFrame = requestAnimationFrame(resize);
    }
    if (on && focus) $('ask').focus(); else if (!on) $('ask').blur();
  };
  // Clicking in or typing (not the cursor landing there from the shortcut): typing wins, so the mic stops and what was heard goes
  const drop = () => {
    if (listening) { listening = false; turn()?.remove(); setState('breathing'); status(''); boost = 1; $('orb').style.transform = ''; fit(); }
    post({ type: 1 });
  };
  $('ask').onmousedown = drop; $('ask').oninput = drop;
  $('ask').onfocus = () => post({ focus: true });
  $('ask').onblur = () => { post({ focus: false }); if (!hover && !$('ask').value) comp(false); };
  $('ask').onkeydown = e => {
    if (!e.isComposing && !listening && !working && !e.target.value && e.key === 'ArrowUp') {
      const q = part('q'); if (q && !q.classList.contains('empty')) { e.preventDefault(); e.target.value = q.textContent; }
    }
    if (e.key !== 'Enter' || e.isComposing) return;
    const t = $('ask').value.trim();
    if (t) post({ send: t });
  };
  $('mic').onclick = () => { $('ask').value = ''; comp(false); post({ mic: 1 }); };
  const status = (s, live) => {
    if (s && listening && listeningHint) s = 'Listening… ' + listeningHint;
    $('status').className = live ? 'live' : '';
    $('status').innerHTML = '<span></span>'; $('status').firstChild.textContent = s;
  };
  const follow = ms => { const end = performance.now() + ms; (function f() { fit(); if (performance.now() < end) requestAnimationFrame(f); })(); };   // the window keeps up with a CSS height change
  const settle = () => turn()?.querySelectorAll('.step.live').forEach(e => { e.classList.remove('live'); e.classList.add('done'); });
  const reveal = (el, text) => {   // the answer fades in word by word, under a second in total
    el.textContent = '';
    const parts = text.split(/(\s+)/), gap = Math.min(16, 900 / parts.length);
    parts.forEach((w, i) => {
      if (/^\s+$/.test(w) || !w) return el.append(w);
      const s = document.createElement('span'); s.className = 'w'; s.style.animationDelay = `${i * gap}ms`; s.textContent = w;
      el.append(s);
    });
  };

  window.ui = {
    visible(on) { visible = on; },
    limit(h) {
      const value = h + 'px';
      if ($('card').style.getPropertyValue('--screen-height') === value) return;
      $('card').style.setProperty('--screen-height', value);
      if ($('card').classList.contains('held')) $('card').style.minHeight = Math.min(h, parseFloat($('card').style.minHeight) || 0) + 'px';
      fit(false);
    },
    reset() { $('thread').innerHTML = ''; $('thread').style.maxHeight = ''; $('card').classList.remove('held'); $('card').style.minHeight = ''; $('card').classList.remove('again'); void $('card').offsetWidth; },
    listen(keep) {   // keep: a typed ask; the box stays for the next one
      hover = false;
      listening = !keep;
      listeningHint = '';
      working = false;
      if (keep) $('ask').value = ''; else comp(false);
      if ($('thread').children.length) $('card').classList.add('again');
      [...$('thread').children].forEach(e => e.classList.add('old'));
      while ($('thread').children.length > 5) $('thread').firstElementChild.remove();
      const d = document.createElement('div'); d.className = 'turn';
      d.innerHTML = '<div class="q live empty" title="Click to edit and ask again"></div><div class="steps"></div><div class="a" title="Click to copy this answer"></div>';
      $('thread').append(d);
      setState('listening'); boost = 1; status('Listening…', true); fit();
    },
    shortcut(hint) { listeningHint = hint; if (listening) status('Listening…', true); },
    level(v) { boost = 0.5 + Math.min(1, v) * 2.5; $('orb').style.transform = `scale(${1 + Math.min(1, v) * .1})`; },
    words(w) { const q = part('q'); if (q) { q.classList.toggle('empty', !w.trim()); q.textContent = w; fit(); } },
    think() {
      listening = false;
      working = true;
      boost = 1; $('orb').style.transform = ''; setState('solving');
      part('q')?.classList.remove('live'); status('Thinking…', true); fit();
    },
    line(l) {
      const tag = l[0], s = l.slice(2);
      if (tag === '·') status(s, true);
      else if (tag === '▸') {
        settle();
        const d = document.createElement('div'); d.className = 'step live'; d.innerHTML = '<span></span>'; d.firstChild.textContent = s;
        part('steps').append(d);
        while (part('steps').children.length > 4) part('steps').firstChild.remove();
        status(s, true);
        setState(/^(Searching|Reading|Looking|Taking|Checking)/.test(s) ? 'searching' : /^(Moving|Opening|Using)/.test(s) ? 'working' : 'connecting');
      } else if (tag === '✓') {
        working = false;
        settle(); part('q')?.classList.remove('live'); status('');
        const a = part('a'); if (a) { a.dataset.answer = s; reveal(a, s); } setState('breathing');
      } else if (tag === 'i' && turn()) {
        const learned = s.startsWith('Learned: '), d = document.createElement('div');   // "Learned" when it saved a rule, else "Tip"
        d.className = 'tip' + (learned ? ' learned' : ''); d.dataset.k = learned ? 'Learned' : 'Tip'; d.textContent = learned ? s.slice(9) : s;
        turn().append(d);
        setTimeout(() => { d.classList.add('gone'); setTimeout(() => { d.remove(); fit(); }, 400); }, 9000);   // never sticks around
      }
      fit();
    },
    msg(s) {
      listening = false; working = false; settle(); part('q')?.classList.remove('live'); setState('breathing'); status('');
      if (part('q')?.classList.contains('empty')) { turn().remove(); status(s); }
      else { const a = part('a'); if (a) { a.className = 'a cancel'; a.textContent = s; } }
      fit();
    },
    stopped(s) {   // Esc or the hotkey cut it off
      listening = false;
      working = false;
      $('thread').querySelectorAll('.ok').forEach(e => e.remove());
      turn()?.querySelectorAll('.step.live').forEach(e => { e.classList.remove('live'); e.classList.add('cut'); });
      setState('breathing'); status(''); boost = 1; $('orb').style.transform = '';
      const q = part('q');
      if (!q || q.classList.contains('empty')) { turn()?.remove(); status(s); return fit(); }
      q.classList.remove('live');
      const a = part('a'); a.className = 'a stopped'; a.innerHTML = '<i></i><span></span>'; a.lastChild.textContent = s;
      fit();
    },
    hover(on) {   // the mouse came over the box: the typing box grows in; left with nothing typed: it goes
      hover = on;
      if (on) comp(true);   // even while listening: the mic keeps going until the user clicks in
      else if (!on && !$('ask').value && document.activeElement !== $('ask')) comp(false);
    },
    compose(on) { comp(on, on); },
    draft(t) { $('ask').value = t; comp(true, true); },
    tap([x, y]) {   // a click on the box, not a drag: on the answer = copy it, anywhere else = type
      const el = document.elementFromPoint(x, y), b = el?.closest('.ok button, .ok');
      if (b) return b.click();
      if (el?.closest('#mode')) return post({ safe: true });
      if (el?.closest('.tip')) { el.closest('.tip').remove(); return fit(); }   // click a tip: it goes
      const on = el?.closest('.a:not(.stopped):not(.cancel)'), q = el?.closest('.q:not(.empty)');
      drop();
      if (on?.dataset.answer) post({ copy: on.dataset.answer });
      else { if (q) $('ask').value = q.textContent; comp(true, true); }
    },   // typing mode's shortcut: open and put the cursor in it
    size(h) { $('thread').style.maxHeight = h + 'px'; fit(); },
    hold(h) {   // the user dragged an edge: the box is h tall until the next conversation
      const c = $('card'), o = $('comp').classList.contains('open') ? $('comp').offsetHeight : 0;
      h = Math.min(h, parseFloat(c.style.getPropertyValue('--screen-height')) || h);
      c.classList.add('held'); c.style.minHeight = h + 'px';
      const t = Math.max(60, h - 26 - $('head').offsetHeight - o - 12);   // 26: card padding; 12: gap under the thread
      $('thread').style.maxHeight = t + 'px'; post({ boxH: t }); fit(false);
    },
    ask([q, cmd]) {   // Allow / Don't Allow; the answer goes back to the app, then the card goes
      $('thread').querySelectorAll('.ok').forEach(e => e.remove());
      const d = document.createElement('div'); d.className = 'ok';
      d.innerHTML = '<b></b><code></code><div><button>Don’t Allow</button><button class="go">Allow</button></div>';
      d.querySelector('b').textContent = q; d.querySelector('code').textContent = cmd;
      const c = d.querySelector('code');
      d.onanimationend = () => d.style.animation = 'none';   // so the shrink below can transition
      d.onclick = () => {   // the whole command: grows open, click again to fold it back
        if (c.classList.toggle('full')) c.classList.add('wrap'); else setTimeout(() => c.classList.contains('full') || c.classList.remove('wrap'), 340);
        follow(360);
      };
      d.querySelectorAll('button').forEach((b, i) => b.onclick = e => {
        e.stopPropagation(); if (d.classList.contains('gone')) return;
        post({ allow: !!i }); status(i ? 'Allowed' : 'Not allowed', true); setState('solving');
        d.classList.add('gone'); follow(360); setTimeout(() => { d.remove(); fit(); }, 360);
      });
      (turn() || $('thread')).append(d); setState('breathing'); status('Waiting for you'); fit();
      setTimeout(() => {
        if (!d.isConnected || d.classList.contains('gone')) return;
        post({ allow: false }); d.remove(); status('Approval expired', true); setState('solving'); fit();
      }, 60000);
    },
    mode(safe) { $('mode').classList.toggle('on', !safe); },
    xhot(on) { $('x').classList.toggle('hot', on); },
    copied() { status('Copied to clipboard'); setTimeout(() => $('status').textContent === 'Copied to clipboard' && status(''), 1400); },
  };
  fit(); post({ ready: 1 });
</script>
</body></html>
